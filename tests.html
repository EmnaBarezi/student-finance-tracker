<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validator Tests - Student Finance Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: Georgia, serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
      line-height: 1.6;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 2rem;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #2c5f8a;
      border-bottom: 2px solid #2c5f8a;
      padding-bottom: 0.5rem;
    }
    
    h2 {
      font-size: 1.3rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #1e4266;
    }
    
    .intro {
      margin-bottom: 2rem;
      color: #666;
      font-size: 0.95rem;
    }
    
    .test-section {
      margin-bottom: 2rem;
      padding: 1rem;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .test-case {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem;
      margin: 0.25rem 0;
      border-left: 3px solid transparent;
    }
    
    .test-case.pass {
      background: #e6f4eb;
      border-left-color: #2a6e3f;
    }
    
    .test-case.fail {
      background: #fae6e6;
      border-left-color: #b33a3a;
    }
    
    .test-icon {
      font-size: 1.2rem;
      font-weight: bold;
      min-width: 24px;
    }
    
    .test-icon.pass { color: #2a6e3f; }
    .test-icon.fail { color: #b33a3a; }
    
    .test-input {
      font-family: monospace;
      background: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }
    
    .test-result {
      font-size: 0.85rem;
      color: #666;
      margin-left: auto;
    }
    
    .summary {
      background: #e8eef5;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 2rem;
      border: 1px solid #9fa8da;
    }
    
    .summary h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #2c5f8a;
    }
    
    .summary-stats {
      display: flex;
      gap: 2rem;
      font-size: 0.95rem;
      flex-wrap: wrap;
    }
    
    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }
    
    .stat-value.pass { color: #2a6e3f; }
    .stat-value.fail { color: #b33a3a; }
    
    code {
      background: #f3f3f3;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    
    .pattern-info {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #2c5f8a;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; Back to App</a>
    
    <h1>Validator Tests</h1>
    <p class="intro">
      Testing all regex validation patterns used in the Student Finance Tracker application.
      All tests run automatically on page load.
    </p>

    <div id="test-output"></div>
    
    <div class="summary" id="summary"></div>
  </div>

  <script src="scripts/validators.js"></script>
  <script>
    var testResults = {
      total: 0,
      passed: 0,
      failed: 0
    };

    function runTest(testName, testFn, input, shouldFail) {
      testResults.total++;
      var result = testFn(input);
      var passed = shouldFail ? (result !== null) : (result === null);
      
      if (passed) {
        testResults.passed++;
      } else {
        testResults.failed++;
      }
      
      return {
        passed: passed,
        input: input,
        result: result,
        expected: shouldFail ? "Should fail" : "Should pass"
      };
    }

    function renderTest(test) {
      var className = test.passed ? "pass" : "fail";
      var icon = test.passed ? "✓" : "✗";
      return (
        '<div class="test-case ' + className + '">' +
          '<span class="test-icon ' + className + '">' + icon + '</span>' +
          '<code class="test-input">' + escapeHtml(test.input) + '</code>' +
          '<span class="test-result">' + test.expected + '</span>' +
        '</div>'
      );
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSection(title, pattern, tests) {
      var html = '<div class="test-section">';
      html += '<h2>' + title + '</h2>';
      html += '<p class="pattern-info">Pattern: <code>' + escapeHtml(pattern) + '</code></p>';
      tests.forEach(function(test) {
        html += renderTest(test);
      });
      html += '</div>';
      return html;
    }

    var output = '';

    // Description Tests
    var descTests = [
      runTest('Description', Validators.description, 'Lunch at cafeteria', false),
      runTest('Description', Validators.description, 'Coffee', false),
      runTest('Description', Validators.description, 'A', false),
      runTest('Description', Validators.description, ' Leading space', true),
      runTest('Description', Validators.description, 'Trailing space ', true),
      runTest('Description', Validators.description, '  Both sides  ', true),
      runTest('Description', Validators.description, '', true),
      runTest('Description', Validators.description, '   ', true),
      runTest('Description', Validators.description, 'the the same', true),
      runTest('Description', Validators.description, 'buy buy groceries', true)
    ];
    output += renderSection('Description Validation', '/^\\S(?:.*\\S)?$|^\\S$/ + /\\b(\\w+)\\s+\\1\\b/i', descTests);

    // Amount Tests
    var amountTests = [
      runTest('Amount', Validators.amount, '12.50', false),
      runTest('Amount', Validators.amount, '0.99', false),
      runTest('Amount', Validators.amount, '100', false),
      runTest('Amount', Validators.amount, '1500.00', false),
      runTest('Amount', Validators.amount, '0', false),
      runTest('Amount', Validators.amount, '12.5', false),
      runTest('Amount', Validators.amount, '5', false),
      runTest('Amount', Validators.amount, '12.505', true),
      runTest('Amount', Validators.amount, '-5', true),
      runTest('Amount', Validators.amount, '-12.50', true),
      runTest('Amount', Validators.amount, 'abc', true),
      runTest('Amount', Validators.amount, '12.', true),
      runTest('Amount', Validators.amount, '.50', true),
      runTest('Amount', Validators.amount, '', true)
    ];
    output += renderSection('Amount Validation', '/^(0|[1-9]\\d*)(\\.\\d{1,2})?$/', amountTests);

    // Date Tests
    var dateTests = [
      runTest('Date', Validators.date, '2025-09-25', false),
      runTest('Date', Validators.date, '2025-01-01', false),
      runTest('Date', Validators.date, '2025-12-31', false),
      runTest('Date', Validators.date, '2024-02-29', false),
      runTest('Date', Validators.date, '2025-06-15', false),
      runTest('Date', Validators.date, '2025-13-01', true),
      runTest('Date', Validators.date, '2025-00-15', true),
      runTest('Date', Validators.date, '2025-09-32', true),
      runTest('Date', Validators.date, '2025-09-00', true),
      runTest('Date', Validators.date, '25-09-2025', true),
      runTest('Date', Validators.date, '2025/09/25', true),
      runTest('Date', Validators.date, '09-25-2025', true),
      runTest('Date', Validators.date, '', true)
    ];
    output += renderSection('Date Validation', '/^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$/', dateTests);

    // Category Name Tests
    var catTests = [
      runTest('Category', Validators.categoryName, 'Food', false),
      runTest('Category', Validators.categoryName, 'Health Care', false),
      runTest('Category', Validators.categoryName, 'Health-Care', false),
      runTest('Category', Validators.categoryName, 'Books', false),
      runTest('Category', Validators.categoryName, 'Transportation', false),
      runTest('Category', Validators.categoryName, 'Food123', true),
      runTest('Category', Validators.categoryName, 'Food  Bar', true),
      runTest('Category', Validators.categoryName, '123Food', true),
      runTest('Category', Validators.categoryName, 'Food@Home', true),
      runTest('Category', Validators.categoryName, ' Food', true),
      runTest('Category', Validators.categoryName, 'Food ', true),
      runTest('Category', Validators.categoryName, '', true),
      runTest('Category', Validators.categoryName, '-Food', true)
    ];
    output += renderSection('Category Name Validation', '/^[A-Za-z]+(?:[ -][A-Za-z]+)*$/', catTests);

    // Regex Compilation Tests (Search)
    var regexTests = [];
    
    function testRegexCompilation(pattern, shouldPass) {
      var result = Validators.isValidRegex(pattern);
      testResults.total++;
      if ((shouldPass && result) || (!shouldPass && !result)) {
        testResults.passed++;
        return { passed: true, input: pattern, expected: shouldPass ? "Valid pattern" : "Invalid pattern" };
      } else {
        testResults.failed++;
        return { passed: false, input: pattern, expected: shouldPass ? "Valid pattern" : "Invalid pattern" };
      }
    }

    regexTests.push(testRegexCompilation('coffee|tea', true));
    regexTests.push(testRegexCompilation('\\d{2,4}', true));
    regexTests.push(testRegexCompilation('^[A-Z]', true));
    regexTests.push(testRegexCompilation('\\b\\w+\\b', true));
    regexTests.push(testRegexCompilation('(lunch|dinner)', true));
    regexTests.push(testRegexCompilation('[unclosed', false));
    regexTests.push(testRegexCompilation('(missing paren', false));
    regexTests.push(testRegexCompilation('*invalid', false));

    output += renderSection('Regex Pattern Compilation (Search)', 'new RegExp(pattern)', regexTests);

    // Render output
    document.getElementById('test-output').innerHTML = output;

    // Render summary
    var passRate = ((testResults.passed / testResults.total) * 100).toFixed(1);
    var summaryHtml = 
      '<h3>Test Summary</h3>' +
      '<div class="summary-stats">' +
        '<div class="stat">' +
          '<span class="stat-value">' + testResults.total + '</span>' +
          '<span>Total Tests</span>' +
        '</div>' +
        '<div class="stat">' +
          '<span class="stat-value pass">' + testResults.passed + '</span>' +
          '<span>Passed</span>' +
        '</div>' +
        '<div class="stat">' +
          '<span class="stat-value fail">' + testResults.failed + '</span>' +
          '<span>Failed</span>' +
        '</div>' +
        '<div class="stat">' +
          '<span class="stat-value ' + (passRate >= 90 ? 'pass' : 'fail') + '">' + passRate + '%</span>' +
          '<span>Pass Rate</span>' +
        '</div>' +
      '</div>';

    document.getElementById('summary').innerHTML = summaryHtml;

    // Log to console for debugging
    console.log('=== VALIDATOR TEST RESULTS ===');
    console.log('Total Tests:', testResults.total);
    console.log('Passed:', testResults.passed);
    console.log('Failed:', testResults.failed);
    console.log('Pass Rate:', passRate + '%');
    console.log('=============================');
  </script>
</body>
</html>
